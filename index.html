</style></head><body><main><canvas id="scene" width="720" height="1280" aria-label="由ASCII字符组成的立体旋转圣诞树，金色灯带环绕，星星礼物闪光，雪花飘落"></canvas><aside><h1>送你一棵<br>字符圣诞树</h1><p>把冬天的星光，送给今年想一起过圣诞节的人。</p><nav><button id="pause">暂停</button><button id="restart">重新播放</button></nav><nav><button id="music">开启音乐</button></nav><label for="volume">音乐音量</label><input id="volume" type="range" min="0" max="1" step="0.05" value="0.8"><audio id="bgm" src="bgm-20s.mp3" loop preload="metadata"></audio><span id="clock">00:00 / 00:20 · 循环播放</span><label for="message">写下你的祝福</label><input id="message" type="text" maxlength="24" value="愿这个冬天，有雪，有光，也有你。"><label for="speed">旋转速度</label><input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"><label><input id="snow" type="checkbox" checked> 飘雪</label><nav><a class="action" href="christmas-20s.mp4" download>下载含原 BGM 的视频</a><button id="watch">播放 MP4</button><a class="action" href="christmas-source.zip" download>下载网页与源码</a></nav><div class="videoWrap" id="videoWrap"><video id="movie" controls playsinline preload="none" poster="poster.png" src="christmas-20s.mp4"></video></div><details><summary>如何修改网页</summary><p>下载源码后解压，双击 index.html 即可播放。可在 scene.js 的 CONFIG 中修改默认祝福、旋转速度和飘雪设置。这里的输入会实时修改网页动画；下载的视频为固定成片。点击“开启音乐”可播放与参考视频相同的 BGM，音量可调。</p></details><footer>树、星星、礼物、树干与树根均由字母和符号绘制。<br>20 秒 · 720 × 1280 · 30 fps · 原 BGM</footer></aside></main><script src="scene.js"></script><script src="app.js"></script></body></html>
